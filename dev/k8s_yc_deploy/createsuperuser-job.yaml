apiVersion: batch/v1
kind: Job
metadata:
  name: django-createsuperuser
  namespace: edu-igor-derevnin
spec:
  ttlSecondsAfterFinished: 600  
  backoffLimit: 2 
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: createsuperuser
        image: #ДОБАВИТЬ
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          echo "=== Creating superuser from secrets ==="
          python manage.py shell << EOF
          import os
          from django.contrib.auth import get_user_model
          
          username = os.environ.get('SUPERUSER_USERNAME', 'admin')
          email = os.environ.get('SUPERUSER_EMAIL', 'admin@example.com')
          password = os.environ.get('SUPERUSER_PASSWORD')
          
          User = get_user_model()
          
          if not User.objects.filter(username=username).exists():
              if password:
                  User.objects.create_superuser(username, email, password)
                  print(f" Superuser '{username}' created successfully")
                  print(f" Email: {email}")
              else:
                  print(f"✗ Error: SUPERUSER_PASSWORD is not set")
                  exit(1)
          else:
              print(f"✓ Superuser '{username}' already exists, skipping")
          
          print("=== Superuser operation completed ===")
          EOF
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: ALLOWED_HOSTS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: secret-key
        
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres
              key: name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres
              key: username
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: postgres
              key: host
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: postgres
              key: port
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: password
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

        - name: PGSSLMODE
          value: "require"                          
        - name: PGSSLROOTCERT
          value: "/etc/postgresql/root.crt"
        
        - name: SUPERUSER_USERNAME
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: superuser-username
        - name: SUPERUSER_EMAIL
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: superuser-email
        - name: SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: superuser-password

        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: bucket
              key: access_key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: bucket
              key: secret_key
        - name: AWS_STORAGE_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: bucket
              key: bucket_name
        - name: AWS_S3_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: bucket
              key: endpoint_url
        - name: AWS_S3_REGION_NAME
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: AWS_S3_REGION_NAME
        - name: AWS_S3_SIGNATURE_VERSION
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: AWS_S3_SIGNATURE_VERSION
        - name: AWS_QUERYSTRING_AUTH
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: AWS_QUERYSTRING_AUTH
        - name: AWS_DEFAULT_ACL
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: AWS_DEFAULT_ACL
        - name: STATIC_URL
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: STATIC_URL
        - name: MEDIA_URL
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: MEDIA_URL
        - name: STATICFILES_STORAGE
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: STATICFILES_STORAGE
        - name: DEFAULT_FILE_STORAGE
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: DEFAULT_FILE_STORAGE


        volumeMounts:
        - name: postgres-ssl
          mountPath: /etc/postgresql
          readOnly: true
      
      volumes:
      - name: postgres-ssl
        secret:
          secretName: postgres
          items:
          - key: root.crt
            path: root.crt       