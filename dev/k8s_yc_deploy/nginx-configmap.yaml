apiVersion: v1
kind: ConfigMap
metadata:
  name: main-nginx-config
  namespace: edu-igor-derevnin
data:
  nginx.conf: |
    user nginx;
    worker_processes  2;
    events {
      worker_connections  10240;
    }
    http {
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      
      upstream django {
        server django-service:80;
      }
      
      server {
        listen 80;
        server_name edu-igor-derevnin.yc-sirius-dev.pelid.team;
        
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        
        location /static/ {
          proxy_pass https://storage.yandexcloud.net/edu-igor-derevnin/static/;
          proxy_set_header Host storage.yandexcloud.net;
          proxy_ssl_verify off;
        }
        
        location /media/ {
          proxy_pass https://storage.yandexcloud.net/edu-igor-derevnin/media/;
          proxy_set_header Host storage.yandexcloud.net;
          proxy_ssl_verify off;
        }
        
        location / {
          proxy_pass http://django;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health/ {
          proxy_pass http://django/health/;
          access_log off;
        }
      }
    }